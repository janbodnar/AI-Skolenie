<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <rect width="800" height="470" rx="12" fill="#ffffff"/>

  <text x="40" y="48" font-size="24" font-weight="700" fill="#1f2937">Model zručností v ére AI</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">Tri vrstvy, ktoré stoja na sebe, a učenie, ktoré ich drží v pohybe</text>

  <!-- Vrstva 3: ľudské jadro -->
  <rect x="40" y="100" width="560" height="100" rx="10" fill="#fdecef" stroke="#e11d48" stroke-width="1.5"/>
  <text x="60" y="130" font-size="12" font-weight="700" fill="#be123c" letter-spacing="0.5">3 · ĽUDSKÉ JADRO</text>
  <text x="60" y="158" font-size="18" font-weight="600" fill="#1f2937">Úsudok · zodpovednosť · komunikácia · tvorivosť</text>
  <text x="60" y="183" font-size="13" fill="#4b5563">Rozhoduje, čo má zmysel robiť, a nesie za to zodpovednosť</text>

  <!-- Vrstva 2: práca s AI -->
  <rect x="40" y="215" width="560" height="100" rx="10" fill="#e6f4fb" stroke="#0284c7" stroke-width="1.5"/>
  <text x="60" y="245" font-size="12" font-weight="700" fill="#0369a1" letter-spacing="0.5">2 · PRÁCA S AI</text>
  <text x="60" y="273" font-size="18" font-weight="600" fill="#1f2937">Zadávanie · overovanie · automatizácia · limity</text>
  <text x="60" y="298" font-size="13" fill="#4b5563">Násobí výkon – ale len toho, čo už vieme posúdiť</text>

  <!-- Vrstva 1: odbornosť -->
  <rect x="40" y="330" width="560" height="100" rx="10" fill="#e8f5ec" stroke="#16a34a" stroke-width="1.5"/>
  <text x="60" y="360" font-size="12" font-weight="700" fill="#15803d" letter-spacing="0.5">1 · ODBORNOSŤ V DOMÉNE</text>
  <text x="60" y="388" font-size="18" font-weight="600" fill="#1f2937">Znalosti · kontext · skúsenosť</text>
  <text x="60" y="413" font-size="13" fill="#4b5563">Základ, bez ktorého nespoznáme chybu vo výstupe AI</text>

  <!-- Učenie a prispôsobivosť -->
  <rect x="618" y="100" width="152" height="330" rx="10" fill="#fef6e0" stroke="#d97706" stroke-width="1.5"/>
  <text x="694" y="135" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="0.5">MOTOR</text>
  <text x="694" y="172" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Učenie</text>
  <text x="694" y="194" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">a prispôsobivosť</text>
  <path d="M694 225 L694 385" stroke="#d97706" stroke-width="2.5" fill="none"/>
  <path d="M684 240 L694 222 L704 240" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <path d="M684 370 L694 388 L704 370" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <text x="694" y="412" font-size="12" fill="#4b5563" text-anchor="middle">obnovuje všetky</text>
  <text x="694" y="426" font-size="12" fill="#4b5563" text-anchor="middle">tri vrstvy</text>
</svg>
